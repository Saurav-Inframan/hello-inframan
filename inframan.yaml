version: v1
application: hello-inframan
namespace: hello-inframan
services:
  web:
    type: web
    path: ""
    port: 3000
    scaling:
      type: concurrency
      min_replicas: 0
      max_replicas: 1
      target: 100
    resources:
      cpu_request: "50m"
      memory_request: "64Mi"
      cpu_limit: "100m"
      memory_limit: "128Mi"
    network:
      timeout_seconds: 300
    build:
      method: docker
      dockerfile: ./Dockerfile
